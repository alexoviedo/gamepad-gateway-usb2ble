name: PR Artifact Build

on:
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: "pr-artifact-build-${{ github.event.pull_request.number }}"
  cancel-in-progress: true

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      firmware: ${{ steps.filter.outputs.firmware }}
      webapp: ${{ steps.filter.outputs.webapp }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            firmware:
              - 'main/**'
              - 'CMakeLists.txt'
              - 'idf_component.yml'
              - 'main/idf_component.yml'
              - 'dependencies.lock'
              - 'sdkconfig.defaults'
              - '.github/workflows/ci.yml'
            webapp:
              - 'webapp/**'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig.web.json'
              - 'eslint.config.js'
              - '.github/workflows/ci.yml'
              - '.github/workflows/promote-artifacts.yml'

  build-metadata:
    needs: detect-changes
    runs-on: ubuntu-latest
    steps:
      - name: Write PR build manifest
        run: |
          mkdir -p out/metadata
          cat > out/metadata/manifest.json <<JSON
          {
            "pr_number": ${{ github.event.pull_request.number }},
            "head_sha": "${{ github.event.pull_request.head.sha }}",
            "base_sha": "${{ github.event.pull_request.base.sha }}",
            "components": {
              "firmware": ${{ needs.detect-changes.outputs.firmware }},
              "webapp": ${{ needs.detect-changes.outputs.webapp }}
            }
          }
          JSON

      - name: Upload PR build manifest
        uses: actions/upload-artifact@v4
        with:
          name: pr-build-metadata
          path: out/metadata/manifest.json
          if-no-files-found: error
          retention-days: 14

  build-firmware:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.firmware == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.3
          target: esp32s3
          path: .
          command: idf.py build

      - name: Package firmware artifact
        run: |
          mkdir -p out/firmware
          cp build/bootloader/bootloader.bin out/firmware/
          cp build/partition_table/partition-table.bin out/firmware/
          cp build/hotas_ble.bin out/firmware/
          cp build/hotas_ble.elf out/firmware/
          cp build/flasher_args.json out/firmware/
          tar -C out/firmware -czf out/firmware-build.tgz .

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-build
          path: out/firmware-build.tgz
          if-no-files-found: error
          retention-days: 14

  build-webapp:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.webapp == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check web app
        run: npm run check:web

      - name: Package webapp artifact
        run: |
          test -f webapp/index.html
          mkdir -p out/site
          rsync -a --delete --exclude 'node_modules' --exclude '.DS_Store' webapp/ out/site/
          touch out/site/.nojekyll
          tar -C out/site -czf out/webapp-pages.tgz .

      - name: Upload webapp artifact
        uses: actions/upload-artifact@v4
        with:
          name: webapp-pages
          path: out/webapp-pages.tgz
          if-no-files-found: error
          retention-days: 14
