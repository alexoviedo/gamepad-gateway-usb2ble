name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      firmware: ${{ steps.filter.outputs.firmware }}
      webapp: ${{ steps.filter.outputs.webapp }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            firmware:
              - 'main/**'
              - 'CMakeLists.txt'
              - 'idf_component.yml'
              - 'dependencies.lock'
              - 'sdkconfig.defaults'
              - '.github/workflows/ci.yml'
            webapp:
              - 'webapp/**'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig.web.json'
              - '.github/workflows/ci.yml'

  build-firmware:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.firmware == 'true' || github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: esp-idf build
      uses: espressif/esp-idf-ci-action@v1
      with:
        esp_idf_version: v5.5.3
        target: esp32s3
        path: '.'
        command: 'idf.py build'

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: firmware
        path: |
          build/bootloader/bootloader.bin
          build/partition_table/partition-table.bin
          build/hotas_ble.bin
          build/hotas_ble.elf
          build/flasher_args.json

  build-webapp:
    needs: [detect-changes, build-firmware]
    if: |
      always() &&
      needs.detect-changes.outputs.webapp == 'true' &&
      (needs.build-firmware.result == 'success' || needs.build-firmware.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Check web app (typecheck + lint)
      run: npm run check:web

    - name: Setup Pages
      if: github.ref == 'refs/heads/main'
      uses: actions/configure-pages@v5

    - name: Upload artifact
      if: github.ref == 'refs/heads/main'
      uses: actions/upload-pages-artifact@v3
      with:
        path: 'webapp'

  deploy-webapp:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-webapp
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
